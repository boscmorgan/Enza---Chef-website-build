       write access to the repo. Bump this deliberately after checking the notes. -->

  <!-- Tells whoever is editing whether a save actually reached the live site.
       Sveltia only knows the commit landed on GitHub; Vercel can still block
       the build afterwards, which is invisible from here. See the notes at the
       top of deploy-status.js. Self-contained, read-only, no secrets. -->
  <script src="deploy-status.js"></script>
